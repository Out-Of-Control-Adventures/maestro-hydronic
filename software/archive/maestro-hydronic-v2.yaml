# =============================================================================
# MAESTRO HYDRONIC — v0.2.0 Ring Gauge UI
# =============================================================================
# WT32-SC01 Plus | ESPHome + LVGL
# Landscape 480x320 | USB cable on left
# Ring: Room temperature (always)
# Buttons: Heater | Floor | Fan | DHW | Settings | Diagnostics
# =============================================================================

substitutions:
  device_name: 'maestro-hydronic'
  friendly_name: 'Maestro Hydronic'
  # MDI Icons
  mdi_fire: "\U000F0238"
  mdi_heating_coil: "\U000F1AAB"
  mdi_fan: "\U000F0210"
  mdi_water: "\U000F058E"
  mdi_cog: "\U000F0493"
  mdi_chart: "\U000F006E"
  mdi_wifi: "\U000F05A9"
  mdi_wifi_off: "\U000F05AA"
  mdi_thermometer: "\U000F050F"
  # Colors
  color_white: "0xFFFFFF"
  color_grey: "0xa5a5a5"
  color_dark_grey: "0x282828"
  color_bg: "0x212121"
  color_light_grey: "0x444444"
  color_accent: "0x18bcf2"
  color_heater_on: "0xE74C3C"
  color_floor_on: "0xF39C12"
  color_fan_on: "0x3498DB"
  color_ring_ticks: "0x585858"
  color_temp_needle: "0x35ffe6"
  color_success: "0x2ECC71"
  color_warning: "0xE67E22"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - delay: 1s
    - script.execute: turn_on_screen_light
    - delay: 3s
    - lvgl.widget.hide: boot_screen

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_password

captive_portal:

# =============================================================================
# DISPLAY
# =============================================================================
spi:
  - type: octal
    id: octal_spi
    clk_pin: 47
    data_pins:
      - 9
      - ignore_strapping_warning: true
        number: 46
      - ignore_strapping_warning: true
        number: 3
      - 8
      - 18
      - 17
      - 16
      - 15

power_supply:
  - id: backlight_ps
    enable_on_boot: true
    pin:
      ignore_strapping_warning: true
      number: GPIO45

display:
  - platform: mipi_spi
    id: main_display
    model: wt32-sc01-plus
    data_rate: 10MHz
    rotation: 90
    auto_clear_enabled: false
    update_interval: never

# =============================================================================
# TOUCH
# =============================================================================
i2c:
  - id: touch_i2c
    sda: GPIO6
    scl: GPIO5
    frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: device_touchscreen
    interrupt_pin: GPIO7
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - script.execute: turn_on_screen_light

# =============================================================================
# BACKLIGHT (PWM dimming)
# =============================================================================
output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO45
      ignore_strapping_warning: true

light:
  - platform: monochromatic
    id: backlight_light
    name: Backlight
    output: backlight_pwm
    default_transition_length: 500ms
    restore_mode: RESTORE_AND_ON

# =============================================================================
# GLOBALS
# =============================================================================
globals:
  - id: heater_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: floor_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: fan_active
    type: bool
    restore_value: true
    initial_value: "false"

# =============================================================================
# SENSORS (simulated — replace with real DS18B20s later)
# =============================================================================
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return 21.5;

  - platform: template
    name: "Loop Supply Temp"
    id: loop_supply_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return 65.0;

  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_signal_db
    update_interval: 60s

# =============================================================================
# FONTS
# =============================================================================
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_abcdefghijklmnopqrstuvwxyz{|}~°±"
    extras:
      - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_wifi}
          - ${mdi_wifi_off}
          - ${mdi_thermometer}

  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_abcdefghijklmnopqrstuvwxyz{|}~°±"
    extras:
      - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_fire}
          - ${mdi_heating_coil}
          - ${mdi_fan}
          - ${mdi_water}
          - ${mdi_cog}
          - ${mdi_chart}

  - file: "gfonts://Roboto@700"
    id: font_huge
    size: 50
    bpp: 4
    glyphs: " -0123456789.°C"

# =============================================================================
# SCRIPTS
# =============================================================================
script:
  - id: turn_on_screen_light
    mode: restart
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight_light
          brightness: 80%
          transition_length: 500ms

  - id: idle_screen_off
    mode: restart
    then:
      - delay: 60s
      - light.turn_on:
          id: backlight_light
          brightness: 40%
          transition_length: 3s
      - delay: 120s
      - light.turn_off:
          id: backlight_light
      - lvgl.pause:
          show_snow: true

  - id: update_display
    then:
      - lambda: |-
          // Room temperature — center of ring
          if (id(room_temp).has_state()) {
            lv_label_set_text(id(main_temp_label),
              str_sprintf("%.1f", id(room_temp).state).c_str());
            lv_meter_set_indicator_value(id(meter_ticks), id(room_temp_needle),
              (int)(id(room_temp).state * 10));
          }
          // Loop temp — top right
          if (id(loop_supply_temp).has_state()) {
            lv_label_set_text(id(loop_temp_label),
              str_sprintf("Loop: %.0f°C", id(loop_supply_temp).state).c_str());
          }
          // Button icon colors
          lv_obj_set_style_text_color(id(heater_btn_icon),
            id(heater_active) ? lv_color_hex(0xE74C3C) : lv_color_hex(0xa5a5a5), 0);
          lv_obj_set_style_text_color(id(floor_btn_icon),
            id(floor_active) ? lv_color_hex(0xF39C12) : lv_color_hex(0xa5a5a5), 0);
          lv_obj_set_style_text_color(id(fan_btn_icon),
            id(fan_active) ? lv_color_hex(0x3498DB) : lv_color_hex(0xa5a5a5), 0);

# =============================================================================
# INTERVAL
# =============================================================================
interval:
  - interval: 5s
    then:
      - script.execute: update_display

# =============================================================================
# LVGL
# =============================================================================
lvgl:
  displays: main_display
  touchscreens: device_touchscreen
  on_idle:
    - timeout: 180000
      then:
        - script.execute: idle_screen_off
  bg_color: ${color_bg}
  text_color: ${color_white}
  scrollbar_mode: "OFF"
  default_font: font_small

  style_definitions:
    - id: style_zone_btn
      bg_opa: TRANSP
      radius: 50
      outline_width: 1
      outline_color: ${color_light_grey}
      height: 44
      width: 56
    - id: style_zone_btn_icon
      align: CENTER
      text_font: font_medium
      text_color: ${color_grey}

  # TOP LAYER
  top_layer:
    widgets:
      # Time — top left
      - label:
          id: time_label
          align: TOP_LEFT
          x: 10
          y: 8
          text: "--:--"
          text_font: font_small
          text_color: ${color_grey}

      # Loop temp — top right
      - label:
          id: loop_temp_label
          align: TOP_RIGHT
          x: -40
          y: 8
          text: "Loop: --°C"
          text_font: font_small
          text_color: ${color_accent}

      # WiFi icon — far top right
      - label:
          id: wifi_icon
          align: TOP_RIGHT
          x: -10
          y: 8
          text: ${mdi_wifi_off}
          text_font: font_small
          text_color: ${color_warning}

      # Boot splash
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: ${color_bg}
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - label:
                align: CENTER
                y: -20
                text: "MAESTRO"
                text_font: font_huge
                text_color: ${color_accent}
            - label:
                align: CENTER
                y: 30
                text: "HYDRONIC"
                text_font: font_medium
                text_color: ${color_grey}
            - spinner:
                align: CENTER
                y: 80
                height: 40
                width: 40
                spin_time: 1s
                arc_length: 60deg
                arc_width: 6
                indicator:
                  arc_color: ${color_accent}
                  arc_width: 6
          on_press:
            - lvgl.widget.hide: boot_screen

  # PAGES
  pages:
    - id: main_page
      widgets:
        # ===== RING GAUGE =====

        # Layer 1: Outer arc
        - arc:
            height: 230
            width: 230
            y: -15
            align: CENTER
            arc_color: ${color_light_grey}
            arc_opa: COVER
            arc_width: 8
            arc_rounded: false
            knob:
              bg_color: ${color_white}

        # Layer 2: Dark ring
        - obj:
            height: 218
            width: 218
            y: -15
            radius: 110
            align: CENTER
            border_width: 35
            border_color: ${color_dark_grey}
            bg_color: ${color_bg}

        # Layer 3: Meter (10-35°C range, x10 for LVGL)
        - meter:
            id: meter_ticks
            height: 228
            width: 228
            y: -15
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: 100
              range_to: 350
              ticks:
                count: 51
                length: 16
                width: 2
                color: ${color_ring_ticks}
              indicators:
                - line:
                    id: room_temp_needle
                    color: ${color_temp_needle}
                    width: 3
                    r_mod: 8
                    value: 215

        # Layer 4: Inner mask
        - obj:
            height: 165
            width: 165
            y: -15
            radius: 83
            align: CENTER
            border_width: 10
            border_color: ${color_dark_grey}
            bg_color: ${color_bg}

        # ===== CENTER LABELS =====

        - label:
            align: CENTER
            y: -58
            text: "ROOM"
            text_font: font_small
            text_color: ${color_grey}

        - label:
            id: main_temp_label
            align: CENTER
            y: -18
            text_font: font_huge
            text: "---"
            text_color: ${color_white}

        - label:
            align: CENTER
            x: 55
            y: -30
            text: "°C"
            text_font: font_small
            text_color: ${color_grey}

        # ===== 6 BOTTOM BUTTONS (72px spacing) =====

        # 1: HEATER
        - button:
            x: -180
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: heater_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_fire}
            on_press:
              - lambda: id(heater_active) = !id(heater_active);
              - script.execute: update_display

        # 2: FLOOR
        - button:
            x: -108
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: floor_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_heating_coil}
            on_press:
              - lambda: id(floor_active) = !id(floor_active);
              - script.execute: update_display

        # 3: FAN
        - button:
            x: -36
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: fan_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_fan}
            on_press:
              - lambda: id(fan_active) = !id(fan_active);
              - script.execute: update_display

        # 4: DHW (placeholder)
        - button:
            x: 36
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: dhw_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_water}
            on_press:
              - logger.log: "DHW pressed"

        # 5: SETTINGS (placeholder)
        - button:
            x: 108
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: settings_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_cog}
            on_press:
              - logger.log: "Settings pressed"

        # 6: DIAGNOSTICS (placeholder)
        - button:
            x: 180
            y: -8
            styles: style_zone_btn
            widgets:
              - label:
                  id: diag_btn_icon
                  styles: style_zone_btn_icon
                  text: ${mdi_chart}
            on_press:
              - logger.log: "Diagnostics pressed"
