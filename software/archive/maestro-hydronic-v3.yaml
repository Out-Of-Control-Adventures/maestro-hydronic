# =============================================================================
# MAESTRO HYDRONIC — v0.3.0 Ring Gauge UI
# =============================================================================
# WT32-SC01 Plus | ESPHome 2026.2.4 + LVGL
# Landscape 480x320 | USB cable on left
#
# Features:
#   - Ring gauge: room temp + draggable target setpoint
#   - Nest-style orange glow when heating (target > current)
#   - HA-synced time with timezone
#   - Flex container button row
#   - 6 zone buttons with toggle colors
# =============================================================================

substitutions:
  device_name: 'maestro-hydronic'
  friendly_name: 'Maestro Hydronic'
  # MDI Icons
  mdi_fire: "\U000F0238"
  mdi_heating_coil: "\U000F1AAB"
  mdi_fan: "\U000F0210"
  mdi_water: "\U000F058E"
  mdi_cog: "\U000F0493"
  mdi_chart: "\U000F006E"
  mdi_wifi: "\U000F05A9"
  mdi_wifi_off: "\U000F05AA"
  mdi_thermometer: "\U000F050F"
  # Colors
  color_white: "0xFFFFFF"
  color_grey: "0xa5a5a5"
  color_dark_grey: "0x111111"
  color_bg: "0x000000"
  color_light_grey: "0x444444"
  color_accent: "0x18bcf2"
  color_ring_ticks: "0x585858"
  color_temp_needle: "0x35ffe6"
  color_target_knob: "0xFF6D00"
  color_heating_bg: "0x3D1D00"
  color_warning: "0xE67E22"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - delay: 1s
    - script.execute: turn_on_screen_light
    - delay: 3s
    - lvgl.widget.hide: boot_screen

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_password

captive_portal:

# =============================================================================
# TIME — synced from Home Assistant (handles timezone automatically)
# =============================================================================
time:
  - platform: homeassistant
    id: ha_time
    timezone: America/Vancouver
    on_time:
      - seconds: 0
        then:
          - script.execute: update_time_label

# =============================================================================
# DISPLAY
# =============================================================================
spi:
  - type: octal
    id: octal_spi
    clk_pin: 47
    data_pins:
      - 9
      - ignore_strapping_warning: true
        number: 46
      - ignore_strapping_warning: true
        number: 3
      - 8
      - 18
      - 17
      - 16
      - 15

display:
  - platform: mipi_spi
    id: main_display
    model: wt32-sc01-plus
    data_rate: 10MHz
    rotation: 90
    auto_clear_enabled: false
    update_interval: never

# =============================================================================
# TOUCH
# =============================================================================
i2c:
  - id: touch_i2c
    sda: GPIO6
    scl: GPIO5
    frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: device_touchscreen
    interrupt_pin: GPIO7
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - script.execute: turn_on_screen_light

# =============================================================================
# BACKLIGHT
# =============================================================================
output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO45
      ignore_strapping_warning: true

light:
  - platform: monochromatic
    id: backlight_light
    name: Backlight
    output: backlight_pwm
    default_transition_length: 500ms
    restore_mode: RESTORE_AND_ON

# =============================================================================
# GLOBALS
# =============================================================================
globals:
  - id: heater_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: floor_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: fan_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: target_temp
    type: float
    restore_value: true
    initial_value: "22.0"

# =============================================================================
# SENSORS (simulated — replace with real DS18B20s later)
# =============================================================================
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return 21.5;
    on_value:
      then:
        - script.execute: update_display

  - platform: template
    name: "Loop Supply Temp"
    id: loop_supply_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return 65.0;
    on_value:
      then:
        - script.execute: update_display

  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_signal_db
    update_interval: 60s

# =============================================================================
# FONTS
# =============================================================================
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 4
    glyphs: " !%()*+,-./0123456789:;<=>?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
    extras:
      - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_wifi}
          - ${mdi_wifi_off}
          - ${mdi_thermometer}

  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
    bpp: 4
    glyphs: " !%()*+,-./0123456789:;<=>?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
    extras:
      - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_fire}
          - ${mdi_heating_coil}
          - ${mdi_fan}
          - ${mdi_water}
          - ${mdi_cog}
          - ${mdi_chart}

  - file: "gfonts://Roboto@700"
    id: font_huge
    size: 50
    bpp: 4
    glyphs: " -0123456789.°C"

  - file: "gfonts://Roboto"
    id: font_target
    size: 16
    bpp: 4
    glyphs: " -0123456789.°CTaget:rs"

# =============================================================================
# SCRIPTS
# =============================================================================
script:
  - id: turn_on_screen_light
    mode: restart
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight_light
          brightness: 80%
          transition_length: 500ms

  - id: idle_screen_off
    mode: restart
    then:
      - delay: 60s
      - light.turn_on:
          id: backlight_light
          brightness: 40%
          transition_length: 3s
      - delay: 120s
      - light.turn_off:
          id: backlight_light
      - lvgl.pause:
          show_snow: true

  - id: update_time_label
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            static const char * const tz_short[] = {"","","","","","","",""};
            static char buf[20];
            auto now = id(ha_time).now();
            if (!now.is_valid()) return "No time";
            int h = now.hour;
            int m = now.minute;
            const char* ampm = h >= 12 ? "PM" : "AM";
            h = h % 12;
            if (h == 0) h = 12;
            snprintf(buf, sizeof(buf), "%d:%02d %s", h, m, ampm);
            return buf;

  - id: update_display
    then:
      - lambda: |-
          float current = id(room_temp).has_state() ? id(room_temp).state : 0;
          float target = id(target_temp);
          bool heating_needed = target > current;

          // --- Room temperature needle ---
          lv_meter_set_indicator_value(id(meter_ticks), id(room_temp_needle),
            (int)(current * 10));

          // --- Center temp label ---
          lv_label_set_text(id(main_temp_label),
            str_sprintf("%.1f", current).c_str());

          // --- Target temp label ---
          lv_label_set_text(id(target_temp_label),
            str_sprintf("Target: %.1f°C", target).c_str());

          // --- Target temp ticks on meter ---
          if (target > current) {
            // Show ticks from current up to target (heating zone)
            lv_meter_set_indicator_start_value(id(meter_ticks), id(target_temp_ticks),
              (int)(current * 10));
            lv_meter_set_indicator_end_value(id(meter_ticks), id(target_temp_ticks),
              (int)(target * 10));
          } else {
            // Hide ticks when satisfied
            lv_meter_set_indicator_start_value(id(meter_ticks), id(target_temp_ticks), 0);
            lv_meter_set_indicator_end_value(id(meter_ticks), id(target_temp_ticks), 0);
          }

          // --- Nest-style orange inner glow when heating needed ---
          if (heating_needed) {
            lv_obj_set_style_bg_color(id(ring_inner_bg), lv_color_hex(0x3D1D00), 0);
            lv_obj_set_style_border_color(id(ring_inner_bg), lv_color_hex(0x2A1300), 0);
          } else {
            lv_obj_set_style_bg_color(id(ring_inner_bg), lv_color_hex(0x000000), 0);
            lv_obj_set_style_border_color(id(ring_inner_bg), lv_color_hex(0x111111), 0);
          }

          // --- Loop temp top right ---
          if (id(loop_supply_temp).has_state()) {
            lv_label_set_text(id(loop_temp_label),
              str_sprintf("Loop: %.0f°C", id(loop_supply_temp).state).c_str());
          }

          // --- Button icon colors ---
          lv_obj_set_style_text_color(id(heater_btn_icon),
            id(heater_active) ? lv_color_hex(0xE74C3C) : lv_color_hex(0xa5a5a5), 0);
          lv_obj_set_style_text_color(id(floor_btn_icon),
            id(floor_active) ? lv_color_hex(0xF39C12) : lv_color_hex(0xa5a5a5), 0);
          lv_obj_set_style_text_color(id(fan_btn_icon),
            id(fan_active) ? lv_color_hex(0x3498DB) : lv_color_hex(0xa5a5a5), 0);

# =============================================================================
# INTERVAL
# =============================================================================
interval:
  - interval: 5s
    then:
      - script.execute: update_display

# =============================================================================
# LVGL
# =============================================================================
lvgl:
  displays: main_display
  touchscreens: device_touchscreen
  on_idle:
    - timeout: 180000ms
      then:
        - script.execute: idle_screen_off
  bg_color: ${color_bg}
  text_color: ${color_white}
  scrollbar_mode: "OFF"
  default_font: font_small

  style_definitions:
    - id: style_zone_btn
      bg_opa: TRANSP
      radius: 50
      outline_width: 1
      outline_color: ${color_light_grey}
      height: 44
      width: 56
    - id: style_zone_btn_icon
      align: CENTER
      text_font: font_medium
      text_color: ${color_grey}

  # TOP LAYER
  top_layer:
    widgets:
      # Time — top left
      - label:
          id: time_label
          align: TOP_LEFT
          x: 10
          y: 8
          text: "--:--"
          text_font: font_small
          text_color: ${color_grey}

      # Loop temp — top right
      - label:
          id: loop_temp_label
          align: TOP_RIGHT
          x: -40
          y: 8
          text: "Loop: --°C"
          text_font: font_small
          text_color: ${color_accent}

      # WiFi icon — far top right
      - label:
          id: wifi_icon
          align: TOP_RIGHT
          x: -10
          y: 8
          text: ${mdi_wifi_off}
          text_font: font_small
          text_color: ${color_warning}

      # Boot splash
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: ${color_bg}
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - label:
                align: CENTER
                y: -20
                text: "MAESTRO"
                text_font: font_huge
                text_color: ${color_accent}
            - label:
                align: CENTER
                y: 30
                text: "HYDRONIC"
                text_font: font_medium
                text_color: ${color_grey}
            - spinner:
                align: CENTER
                y: 80
                height: 40
                width: 40
                spin_time: 1s
                arc_length: 60deg
                arc_width: 6
                indicator:
                  arc_color: ${color_accent}
                  arc_width: 6
          on_press:
            - lvgl.widget.hide: boot_screen

  # PAGES
  pages:
    - id: main_page
      widgets:
        # ===== RING GAUGE =====

        # Layer 1: Outer arc
        - arc:
            height: 230
            width: 230
            y: -25
            align: CENTER
            arc_color: ${color_light_grey}
            arc_opa: COVER
            arc_width: 8
            arc_rounded: false
            knob:
              bg_color: ${color_white}

        # Layer 2: Dark ring
        - obj:
            height: 218
            width: 218
            y: -25
            radius: 110
            align: CENTER
            border_width: 35
            border_color: ${color_dark_grey}
            bg_color: ${color_bg}

        # Layer 3: Meter (10-35C, x10 for LVGL)
        - meter:
            id: meter_ticks
            height: 228
            width: 228
            y: -25
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: 100
              range_to: 350
              ticks:
                count: 51
                length: 16
                width: 2
                color: ${color_ring_ticks}
              indicators:
                # Room temperature needle (cyan)
                - line:
                    id: room_temp_needle
                    color: ${color_temp_needle}
                    width: 3
                    r_mod: 8
                    value: 215
                # Target temperature ticks (orange, shown when heating)
                - tick_style:
                    id: target_temp_ticks
                    start_value: 215
                    end_value: 220
                    color_start: ${color_target_knob}
                    color_end: ${color_target_knob}
                    width: 2

        # Layer 4: Inner background (changes to orange when heating)
        - obj:
            id: ring_inner_bg
            height: 165
            width: 165
            y: -25
            radius: 83
            align: CENTER
            border_width: 10
            border_color: ${color_dark_grey}
            bg_color: ${color_bg}

        # Layer 5: Target temperature knob (draggable arc)
        - arc:
            id: target_temp_knob
            align: CENTER
            y: -25
            width: 200
            height: 200
            arc_opa: TRANSP
            adjustable: true
            min_value: 100
            max_value: 350
            value: 220
            arc_width: 14
            change_rate: 20
            indicator:
              arc_opa: TRANSP
              arc_width: 14
            knob:
              bg_color: ${color_target_knob}
              border_width: 3
              border_color: ${color_white}
              width: 16
              height: 16
              radius: 8
            on_change:
              then:
                - lambda: |-
                    float new_target = x / 10.0;
                    // Snap to 0.5 degree increments
                    new_target = roundf(new_target * 2) / 2;
                    id(target_temp) = new_target;
                - script.execute: update_display

        # ===== CENTER LABELS =====

        # "ROOM" label
        - label:
            align: CENTER
            y: -68
            text: "ROOM"
            text_font: font_small
            text_color: ${color_grey}

        # Big temperature
        - label:
            id: main_temp_label
            align: CENTER
            y: -28
            text_font: font_huge
            text: "---"
            text_color: ${color_white}

        # Degree unit
        - label:
            align: CENTER
            x: 55
            y: -40
            text: "°C"
            text_font: font_small
            text_color: ${color_grey}

        # Target temperature (below main temp)
        - label:
            id: target_temp_label
            align: CENTER
            y: 15
            text_font: font_target
            text: "Target: 22.0°C"
            text_color: ${color_target_knob}

        # ===== BUTTON ROW (flex container) =====
        - obj:
            align: BOTTOM_MID
            width: 460
            height: 54
            y: -6
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              # 1: HEATER (flame)
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: heater_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_fire}
                  on_press:
                    - lambda: id(heater_active) = !id(heater_active);
                    - script.execute: update_display

              # 2: FLOOR (heating coil)
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: floor_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_heating_coil}
                  on_press:
                    - lambda: id(floor_active) = !id(floor_active);
                    - script.execute: update_display

              # 3: FAN (hot air)
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: fan_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_fan}
                  on_press:
                    - lambda: id(fan_active) = !id(fan_active);
                    - script.execute: update_display

              # 4: DHW (water drop) — placeholder
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: dhw_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_water}
                  on_press:
                    - logger.log: "DHW pressed"

              # 5: SETTINGS (gear) — placeholder
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: settings_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_cog}
                  on_press:
                    - logger.log: "Settings pressed"

              # 6: DIAGNOSTICS (chart) — placeholder
              - button:
                  styles: style_zone_btn
                  widgets:
                    - label:
                        id: diag_btn_icon
                        styles: style_zone_btn_icon
                        text: ${mdi_chart}
                  on_press:
                    - logger.log: "Diagnostics pressed"
